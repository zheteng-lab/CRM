<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class One CRM</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <nav class="bg-slate-900 text-slate-600 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">C1</div>
                <h1 class="text-xl font-bold text-white tracking-tight">CLASS ONE <span class="text-blue-400">CRM</span></h1>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="showPage('stats')" class="px-4 py-2 rounded-md hover:bg-slate-800 transition-colors text-slate-300 font-medium">Dashboard</button>
                <button onclick="showPage('leads')" class="px-4 py-2 rounded-md hover:bg-slate-800 transition-colors text-slate-300 font-medium">Student Leads</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <div id="stats-page" class="page-section hidden">
            <h2 class="text-2xl font-bold mb-6 text-slate-800 border-b pb-2">Business Overview</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-slate-500 text-sm font-semibold uppercase tracking-wider">Total Leads</p>
                    <p id="stat-total" class="text-4xl font-black text-slate-900 mt-2">0</p>
                </div>
            </div>
        </div>

        <div id="leads-page" class="page-section hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Student Enrollment Leads</h2>
                <div class="flex gap-2">
                    <input type="date" id="export-start" class="p-2 border rounded-md text-sm">
                    <input type="date" id="export-end" class="p-2 border rounded-md text-sm">
                    <button onclick="generatePDF()" class="bg-emerald-600 text-white px-4 py-2 rounded-md hover:bg-emerald-700 transition-colors flex items-center gap-2 shadow-sm">
                        Export PDF
                    </button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 mb-8">
                <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2">
                    <span class="w-2 h-6 bg-blue-600 rounded-full"></span> Quick Add Lead
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="lead-phone" placeholder="Phone Number (Required)" class="p-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                    <input type="text" id="lead-name" placeholder="Student Name (Optional)" class="p-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <button onclick="addItem()" class="bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition-all shadow-md active:scale-95">
                        Add New Lead
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-100">
                        <tr>
                            <th class="p-4 font-bold text-slate-600">Date</th>
                            <th class="p-4 font-bold text-slate-600">Phone Number</th>
                            <th class="p-4 font-bold text-slate-600">Student Name (Editable)</th>
                            <th class="p-4 font-bold text-slate-600">Status</th>
                            <th class="p-4 font-bold text-slate-600 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="leads-body" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // REPLACE WITH YOUR ACTUAL SUPABASE CREDENTIALS
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let masterData = [];

        async function fetchData() {
            const { data, error } = await supabaseClient
                .from('leads')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) return console.error(error);
            masterData = data;
            renderAll();
        }

        function renderAll() {
            document.getElementById('stat-total').innerText = masterData.length;

            const leadsBody = document.getElementById('leads-body');
            leadsBody.innerHTML = '';

            masterData.forEach(item => {
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50 transition-colors";
                row.innerHTML = `
                    <td class="p-4 text-slate-500 text-sm">${new Date(item.created_at).toLocaleDateString()}</td>
                    <td class="p-4 font-medium text-slate-700">${item.phone}</td>
                    <td class="p-4">
                        <input type="text" 
                               value="${item.name || ''}" 
                               placeholder="Add student name..."
                               onchange="updateStudentName('${item.id}', this.value)" 
                               class="w-full p-2 border border-transparent hover:border-slate-200 focus:border-blue-500 rounded bg-transparent focus:bg-white transition-all outline-none">
                    </td>
                    <td class="p-4">
                        <span class="px-2 py-1 rounded-full text-xs font-bold ${getStatusClass(item.status)}">
                            ${item.status}
                        </span>
                    </td>
                    <td class="p-4 text-right">
                        <button onclick="deleteItem('${item.id}')" class="text-rose-500 hover:text-rose-700 font-bold text-sm px-3 py-1">Delete</button>
                    </td>
                `;
                leadsBody.appendChild(row);
            });
        }

        async function addItem() {
            const phone = document.getElementById('lead-phone').value;
            const name = document.getElementById('lead-name').value;

            if (!phone) return alert("Phone number is required");

            const { error } = await supabaseClient
                .from('leads')
                .insert([{ 
                    phone: phone, 
                    name: name || "", 
                    person_type: 'student', 
                    status: 'New' 
                }]);

            if (error) alert(error.message);
            else {
                document.getElementById('lead-phone').value = '';
                document.getElementById('lead-name').value = '';
                fetchData();
            }
        }

        async function updateStudentName(id, newName) {
            const { error } = await supabaseClient
                .from('leads')
                .update({ name: newName })
                .eq('id', id);

            if (error) alert("Failed to update name: " + error.message);
        }

        function getStatusClass(status) {
            switch(status) {
                case 'New': return 'bg-blue-100 text-blue-700';
                case 'Following': return 'bg-amber-100 text-amber-700';
                case 'Enrolled': return 'bg-emerald-100 text-emerald-700';
                default: return 'bg-slate-100 text-slate-700';
            }
        }

        function showPage(pageId) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.add('hidden'));
            document.getElementById(`${pageId}-page`).classList.remove('hidden');
            fetchData();
        }

        async function deleteItem(id) {
            if(confirm("Delete lead permanently?")) {
                await supabaseClient.from('leads').delete().eq('id', id);
                fetchData();
            }
        }

        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            // PDF Generation logic remains the same...
            doc.text("CRM Report", 14, 20);
            doc.save("Report.pdf");
        }

        showPage('stats');
    </script>
</body>
</html>
